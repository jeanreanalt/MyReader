<style>
:root{--bg:#fff;--fg:#222;--pn:#f3f3f3;--bd:#ddd;--ac:#2b6cb0}
[data-t=sepia]{--bg:#f4ecd8;--fg:#433422;--pn:#eadfc4;--bd:#d6c8a5;--ac:#8a5a2b}
[data-t=dark]{--bg:#16181c;--fg:#d4d4d4;--pn:#1f2227;--bd:#32363d;--ac:#6cb2ff}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif;display:flex;flex-direction:column}
header,footer{display:flex;gap:6px;align-items:center;padding:6px 10px;background:var(--pn);border-color:var(--bd);border-style:solid;border-width:0 0 1px}
footer{border-width:1px 0 0;justify-content:space-between}
button,select,label.b{background:var(--bg);color:var(--fg);border:1px solid var(--bd);border-radius:6px;padding:4px 9px;cursor:pointer;font:inherit}
#title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
main{flex:1;display:flex;min-height:0}
aside{width:290px;background:var(--pn);border-right:1px solid var(--bd);overflow:auto;padding:8px;display:none}
aside.on{display:block}
aside h4{margin:8px 4px 4px;opacity:.7}
aside a{display:block;padding:5px 8px;border-radius:5px;cursor:pointer}
aside a:hover,aside a.cur{background:var(--bd)}
#v{flex:1;overflow:auto;padding:28px 18px}
#c{max-width:var(--w);margin:auto;font-family:var(--ff);font-size:var(--fs);line-height:var(--lh)}
#c img,#c svg{max-width:100%;height:auto}#c a{color:var(--ac)}#c a[data-j]{cursor:pointer;text-decoration:underline}
#c h1,#c h2,#c h3{line-height:1.25}
#hint{text-align:center;margin-top:20vh;opacity:.6;font:18px system-ui}
#lib{display:none;flex:1;overflow:auto;padding:22px;grid-template-columns:repeat(auto-fill,150px);gap:20px;align-content:start;justify-content:center}
main.lib #lib{display:grid}main.lib #v,main.lib aside{display:none!important}
.card{position:relative;cursor:pointer}
.cv{height:210px;border-radius:6px;overflow:hidden;background:var(--pn);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;text-align:center}
.cv span{padding:10px;font-size:13px}.cv img{width:100%;height:100%;object-fit:cover}
.tt{margin:6px 0 4px;font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pb{height:3px;background:var(--bd);border-radius:2px}.pb i{display:block;height:100%;background:var(--ac);border-radius:2px}
.x{position:absolute;top:4px;right:4px;padding:0 7px;opacity:0}.card:hover .x{opacity:1}
#v.two{overflow:hidden;padding:var(--pt) min(var(--pm),22vw);clip-path:inset(0 min(var(--pm),22vw))}
#c img{break-inside:avoid}#c h1,#c h2,#c h3{break-after:avoid}
#v.two #c img,#v.two #c svg{max-height:var(--H);object-fit:contain}
mark{background:#ffe066;color:#000}
aside input{width:100%;padding:6px 8px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--fg);font:inherit}
aside small{opacity:.65}aside a span{font-size:13px}
#c{text-align:var(--al);hyphens:var(--hy)}#c p{margin:0 0 var(--ps)}
#pr{height:8px;background:var(--bd);cursor:pointer}#pr i{display:block;height:100%;width:0;background:var(--ac);transition:width .3s}
.fd{animation:fd .35s ease}@keyframes fd{from{opacity:0}to{opacity:1}}
#sp{display:none;position:fixed;top:46px;right:8px;width:330px;max-height:calc(100vh - 110px);overflow:auto;background:var(--pn);border:1px solid var(--bd);border-radius:10px;padding:6px 14px 14px;z-index:20;box-shadow:0 8px 28px #0005}
#sp.on{display:block}#sp h4{margin:12px 0 5px;opacity:.7}
#sw{display:flex;flex-wrap:wrap;gap:6px}#sw button{width:46px;height:34px}#sw button.on{outline:2px solid var(--ac);outline-offset:1px}
#sp .row{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0;align-items:center}
#sp select,#sp input:not([type]),#sp input[type=password]{flex:1;min-width:0;padding:5px 8px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--fg);font:inherit}
#sp label.rg{display:block;margin:7px 0}#sp label.rg b{float:right}#sp input[type=range]{width:100%}#sp input[type=color]{vertical-align:middle;border:0;background:none;width:30px;height:24px;padding:0}
#sp label.ck{display:block;margin:5px 0}#srs{margin-top:10px}
mark.hl{color:inherit;border-radius:2px}
mark.hl[data-c="0"]{background:rgba(255,208,0,.45)}mark.hl[data-c="1"]{background:rgba(82,200,90,.42)}mark.hl[data-c="2"]{background:rgba(70,160,255,.40)}mark.hl[data-c="3"]{background:rgba(255,90,140,.40)}
#hp{display:none;position:fixed;z-index:30;gap:7px;padding:6px 9px;background:var(--pn);border:1px solid var(--bd);border-radius:20px;box-shadow:0 4px 14px #0005;align-items:center}#hp.on{display:flex}
#hp button{width:24px;height:24px;border-radius:50%;padding:0;border:2px solid var(--bd)}#hp #hx,#hp #hn,#hp #hr{width:auto;border-radius:8px;padding:0 6px;background:var(--bg)}
#c .ta{text-align:right;font-style:italic}#c .poem{margin:1em 0 1em 2em}#c .poem p,#c .st p{margin:0}#c .st{margin:.6em 0}#c blockquote{margin:1em 0 1em 2em;opacity:.9}
#pd{display:none;flex:1;overflow:auto;background:var(--pn);padding:16px;position:relative;outline:none}
main.pdf #pd{display:block}main.lib #pd{display:none!important}main.pdf #v{display:none!important}
#pdp{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;gap:12px;margin:0 auto}
.pg{position:relative;background:#fff;box-shadow:0 2px 10px #0005;flex:none;overflow:hidden}.pg canvas{display:block}
body.pdf1 .pg canvas{filter:invert(.9) hue-rotate(180deg)}body.pdf2 .pg canvas{filter:sepia(.55) brightness(.95)}
.textLayer{position:absolute;inset:0;overflow:clip;line-height:1;text-size-adjust:none;forced-color-adjust:none;transform-origin:0 0;z-index:0;color-scheme:only light;--min-font-size:1;--text-scale-factor:calc(var(--total-scale-factor)*var(--min-font-size));--min-font-size-inv:calc(1/var(--min-font-size))}
.textLayer :is(span,br){color:transparent;position:absolute;white-space:pre;cursor:text;transform-origin:0% 0%}
.textLayer>:not(.markedContent),.textLayer .markedContent span:not(.markedContent){z-index:1;--font-height:0;font-size:calc(var(--text-scale-factor)*var(--font-height));--scale-x:1;--rotate:0deg;transform:rotate(var(--rotate)) scaleX(var(--scale-x)) scale(var(--min-font-size-inv))}
.textLayer .markedContent{display:contents}.textLayer ::selection{background:rgba(0,100,255,.3)}.textLayer br::selection{background:transparent}
.textLayer .endOfContent{display:block;position:absolute;inset:100% 0 0;z-index:0;cursor:default;user-select:none}.textLayer.selecting .endOfContent{top:0}
.textLayer span.hit{background:rgba(255,215,0,.55);border-radius:2px}
#pdfbar{display:none}body.pdfm #pdfbar{display:inline}
mark.hl[title]{border-bottom:2px dotted currentColor}
#nt{display:none;position:fixed;z-index:31;width:280px;padding:10px;background:var(--pn);border:1px solid var(--bd);border-radius:10px;box-shadow:0 6px 20px #0006}#nt.on{display:block}
#nt textarea{width:100%;height:90px;resize:vertical;background:var(--bg);color:var(--fg);border:1px solid var(--bd);border-radius:6px;padding:6px;font:inherit}#nt div{display:flex;gap:6px;margin-top:6px}
.cb{position:absolute;top:4px;left:4px;padding:0 6px;opacity:0}.card:hover .cb{opacity:1}
#tb{display:none;position:fixed;z-index:32;width:360px;min-width:240px;max-width:92vw;max-height:70vh;resize:both;overflow:auto;padding:10px 12px;background:var(--pn);border:1px solid var(--bd);border-radius:10px;box-shadow:0 6px 20px #0006;font-size:14px}#tb.on{display:block}
#tb .h{display:flex;justify-content:space-between;align-items:center;margin:-4px -4px 6px;padding:2px 4px;cursor:move;touch-action:none;user-select:none;opacity:.75;font-size:12px}#tb .h .x{cursor:pointer;padding:0 6px;font-size:14px}
#tb .o{opacity:.65;font-size:12px;margin-bottom:6px}#tb .t{font-size:16px;line-height:1.45}#tb .f{margin-top:8px;font-size:12px;opacity:.85}#tb .f a{cursor:pointer;color:var(--ac);text-decoration:underline}
#tp{display:none;position:fixed;z-index:30}#tp.on{display:block}#tp button{box-shadow:0 4px 14px #0005}
